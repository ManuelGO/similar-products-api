server:
  port: 5000

product-api:
  base-url: http://localhost:3001
  connect-timeout: 500ms
  read-timeout: 1s

detail-fetch:
  pool-size: 32
  queue-capacity: 32

product-cache:
  details:
    ttl: 30s
    not-found-ttl: 30s
    failure-ttl: 5s
    max-size: 10000
  similar-ids:
    ttl: 5m
    not-found-ttl: 30s
    failure-ttl: 5s
    max-size: 10000
